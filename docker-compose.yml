services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lottery_sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourSecurePassword123!
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourSecurePassword123!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:7
    container_name: lottery_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: lottery_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_ERLANG_COOKIE=secret_cookie
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lottery_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: lottery_seq
    ports:
      - "5341:5341"
      - "8081:80"
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq_data:/data

  auth-service:
    image: auth-service
    container_name: lottery_auth_service
    build:
      context: ./project-server/MicroServises/AuthService
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AuthDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
      - Seq__Url=http://seq:5341
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  gifts-service-1:
    image: gifts-service
    container_name: lottery_gifts_service_1
    build:
      context: ./project-server/MicroServises/GiftsService
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoConnection=mongodb://mongodb:27017
      - ConnectionStrings__Redis=redis:6379
      - Seq__Url=http://seq:5341
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  gifts-service-2:
    image: gifts-service
    container_name: lottery_gifts_service_2
    build:
      context: ./project-server/MicroServises/GiftsService
      dockerfile: Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoConnection=mongodb://mongodb:27017
      - ConnectionStrings__Redis=redis:6379
      - Seq__Url=http://seq:5341
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  bff-service:
    image: bff-service
    container_name: lottery_bff_service
    build:
      context: ./project-server/MicroServises/BffService
      dockerfile: Dockerfile
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__Orders=http://orders-service:8080
      - Services__Gifts=http://gifts-service-1:8080
    depends_on:
      - orders-service
      - gifts-service-1
      - gifts-service-2

  inventory-service:
    image: inventory-service
    container_name: lottery_inventory_service
    build:
      context: ./project-server/MicroServises/InventoryService
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=InventoryDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - Seq__Url=http://seq:5341
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  orders-service:
    image: orders-service
    container_name: lottery_orders_service
    build:
      context: ./project-server/MicroServises/OrdersService
      dockerfile: Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=OrdersDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - Seq__Url=http://seq:5341
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    image: notification-service
    container_name: lottery_notification_service
    build:
      context: ./project-server/MicroServises/NotificationService
      dockerfile: Dockerfile
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - Seq__Url=http://seq:5341
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./project-claient
      dockerfile: Dockerfile
    container_name: lottery_client
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - gifts-service-1
      - gifts-service-2
      - inventory-service
      - orders-service
      - bff-service

volumes:
  sql_data:
  mongo_data:
  seq_data: