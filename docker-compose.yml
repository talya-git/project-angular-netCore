services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lottery_sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourSecurePassword123!
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourSecurePassword123!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  auth-service:
    image: auth-service
    container_name: lottery_auth_service
    build:
      context: ./project-server/MicroServises/AuthService
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AuthDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  gifts-service:
    image: gifts-service
    container_name: lottery_gifts_service
    build:
      context: ./project-server/MicroServises/GiftsService
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=GiftsDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  inventory-service:
    image: inventory-service
    container_name: lottery_inventory_service
    build:
      context: ./project-server/MicroServises/InventoryService
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=InventoryDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  orders-service:
    image: orders-service
    container_name: lottery_orders_service
    build:
      context: ./project-server/MicroServises/OrdersService
      dockerfile: Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=OrdersDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
      inventory-service:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lottery_client
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - gifts-service
      - inventory-service
      - orders-service

volumes:
  sql_data:
